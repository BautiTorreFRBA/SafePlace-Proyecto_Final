<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafePlace - Horarios Laborales</title><link rel="stylesheet" href="Styles.css" />
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <div class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
        <div><div class="sidebar__name">SafePlace</div><div class="sidebar__sub">BIOMETRIC MONITOR</div></div>
      </div>

      <nav class="sidebar__nav">
        <a class="nav-item" href="Admin-Home.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Home </a>
        <a class="nav-item" href="Admin-Empleados.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Empleados</a>
        <a class="nav-item nav-item--active" href="Admin-HorariosOperarios.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Horarios Laborales</a>
        <a class="nav-item" href="Admin-EstadoDispositivos.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg> Estado Dispositivos</a>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__user">
          <div class="avatar avatar--sm"></div>
          <div><div class="sidebar__user-name"></div><div class="sidebar__user-role"></div></div>
        </div>
        <a class="sidebar__logout" href="InicioSesion.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Cerrar sesión </a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__title">Horarios Laborales</div>
        <div class="topbar__right"><div class="status-dot"><span class="dot dot--green"></span> En línea</div><div class="avatar"></div></div>
      </header>

      <div class="emp-header">
        <div>
          <h2 class="emp-header__title">Horario laboral por operario</h2>
          <p class="emp-header__count" id="infoLine">La alerta de inactividad prolongada sólo se dispara si el wearable se desconecta dentro de este horario.</p>
        </div>
      </div>

      <div class="emp-toolbar" style="flex-wrap:wrap; gap:12px;">
        <div class="modal__field" style="flex:1; min-width:260px;">
          <label class="modal__label" for="operarioSelect">OPERARIO</label>
          <select class="modal__input" id="operarioSelect"><option value="">Cargando...</option></select>
        </div>
        <button class="btn-nuevo" id="btnGuardar" style="align-self:flex-end;" disabled><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M20 6 9 17l-5-5"/></svg> Guardar horario</button>
      </div>

      <div class="emp-table-wrap">
        <table class="emp-table">
          <thead><tr><th>DÍA</th><th>ACTIVO</th><th>DESDE</th><th>HASTA</th></tr></thead>
          <tbody id="horarioBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="session-ui.js"></script>
  <script src="Admin-HorariosOperarios.js"></script>
</body>
</html>
