<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafePlace – Alertas activas</title>
  <link rel="stylesheet" href="Styles.css" />
</head>

<body>
    <div class="app">
        <!-- BARRA LATERAL -->
        <aside class="sidebar">
            <!-- Titulo y Logo -->
            <div class="sidebar__brand">
                <div class="sidebar__icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
                <div><div class="sidebar__name">SafePlace</div><div class="sidebar__sub">BIOMETRIC MONITOR</div></div>
            </div>
            
            <!-- Navegación -->
            <nav class="sidebar__nav">
            <a class="nav-item" href="Supervisor-Home.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>  <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Home </a>
            <a class="nav-item" href="Supervisor-Empleados.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Operarios </a>
            <a class="nav-item" href="Supervisor-Mediciones.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>  Mediciones </a>
            <a class="nav-item" href="Supervisor-Wearables.html"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/> </svg> Wearables </a>
            <a class="nav-item nav-item--active" href="Supervisor-Notificaciones.html"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Alertas activas </a>
            </nav>

            <!-- Usuario logueado + cerrar sesión -->
            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div class="avatar avatar--sm"> <!--PONER EL avatar--> </div>
                    <div>
                        <div class="sidebar__user-name"> <!--PONER EL NOMBRE DEL QUE ENTRO--> </div> 
                        <div class="sidebar__user-role"> <!--PONER EL ROL DEL QUE ENTRO--> </div> 
                    </div>
                </div>
            <a class="sidebar__logout" href='InicioSesion.html'><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Cerrar sesión </a>
            </div>
        </aside>

        <!-- BARRA SUPERIOR --> 
        <main class="main">
            <header class="topbar">
                <div class="topbar__title">Alertas activas</div>
                <div class="topbar__right">
                    <button class="notif-bell" type="button" aria-label="Ver notificaciones"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/> <path d="M13.73 21a2 2 0 0 1-3.46 0"/> </svg> <span class="notif-badge" id="notifBadge" style="display:none"></span> </button>
                    <div class="avatar"> <!--PONER EL avatar--> </div> 
                </div>
            </header>

            <div class="notif-header">
                <div>
                    <h2 class="welcome__title">Alertas activas</h2>
                    <p class="notif-header__count" id="alertCount">Alertas pendientes</p>
                </div>
            </div>
            <div class="notif-filters" role="group" aria-label="Filtrar alertas activas">
                <span class="alert-filter-separator" aria-hidden="true"></span>
                <button class="alert-type-filter is-active" type="button" data-tipo="FATIGA" aria-pressed="true">Fatiga</button>
                <button class="alert-type-filter is-active" type="button" data-tipo="INACTIVIDAD_PROLONGADA" aria-pressed="true">Inactividad prolongada</button>
                <button class="alert-type-filter is-active" type="button" data-tipo="SOBREESFUERZO" aria-pressed="true">Sobreesfuerzo</button>
                <button class="alert-type-filter is-active" type="button" data-tipo="EMERGENCIA" aria-pressed="true">Emergencia</button>
                <button class="alert-type-filter is-active" type="button" data-tipo="SUPER_EMERGENCIA" aria-pressed="true">Súper emergencia</button>
            </div>
            <div class="supervisor-alert-list" id="alertTableBody"></div>
        </main>
    </div>
    <script src="session-ui.js"></script>
    <script src="api-config.js"></script>
  <div class="modal-overlay" id="fcModal" aria-hidden="true">
    <div class="modal fc-modal" role="dialog" aria-modal="true" aria-labelledby="fcModalTitle">
      <div class="modal__header"><div><div class="modal__title" id="fcModalTitle">Frecuencia cardíaca del día</div><div class="fc-modal__subtitle" id="fcModalSubtitle"></div></div><button class="modal__close" type="button" data-fc-close aria-label="Cerrar">×</button></div>
      <div class="modal__body fc-modal__body"><div class="fc-modal__stats" id="fcModalStats"></div><div class="fc-modal__chart" id="fcModalChart"></div></div>
      <div class="modal__footer"><button class="modal__btn modal__btn--cancel" type="button" data-fc-close>Cerrar</button><button class="modal__btn modal__btn--save" type="button" id="fcModalAtender">Atender alerta</button></div>
    </div>
  </div>
  <script src="notificacion-ui.js"></script>
  <script src="confirmar-atencion.js"></script>
  <script>window.SAFEPLACE_ALERTAS_VIEW = 'tarjetas';</script>
  <script src="Seguridad-AlertasActivas.js"></script>
</body>
</html>
