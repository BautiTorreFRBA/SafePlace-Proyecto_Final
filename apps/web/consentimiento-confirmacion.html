<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafePlace - Confirmación de consentimiento</title>
  <link rel="stylesheet" href="Styles.css" />
  <script src="api-config.js"></script>
</head>
<body>
  <main style="max-width:560px;margin:12vh auto;padding:32px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;">
    <h1 id="title">Validando consentimiento...</h1>
    <p id="message">Por favor esperá un momento.</p>
  </main>
  <script>
    const API_BASE_URL = window.__SAFEPLACE_API_URL__ || 'https://safeplace-backend-9vhx.onrender.com/api/v1';
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const token = new URLSearchParams(window.location.search).get('token');
    fetch(`${API_BASE_URL}/consentimientos/confirmar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    })
      .then(async (response) => {
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || 'No se pudo confirmar el consentimiento.');
        title.textContent = 'Consentimiento confirmado';
        message.textContent = 'Tu consentimiento fue registrado correctamente. Ya podés cerrar esta ventana.';
      })
      .catch((error) => {
        title.textContent = 'No se pudo confirmar';
        message.textContent = error.message;
      });
  </script>
</body>
</html>
