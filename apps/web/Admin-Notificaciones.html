            </div>

            <!-- Navegación -->
            <nav class="sidebar__nav">
            <a class="nav-item" href="Admin-Home.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Home </a>

            <a class="nav-item" href="Admin-HorariosOperarios.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Horarios Laborales </a>
            <a class="nav-item" href="Admin-AsociarWearable.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg> Asociar Wearable </a>
            <a class="nav-item" href="Admin-EstadoDispositivos.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg> Estado Dispositivos </a>
            <a class="nav-item" href="Admin-Consentimientos.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Consentimientos </a>
            <a class="nav-item nav-item--active" href="Admin-Notificaciones.html"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notificaciones </a>

            </nav>

            <!-- Usuario logueado + cerrar sesión -->
            <div class="sidebar__footer">
                <div class="sidebar__user">
                    <div class="avatar avatar--sm"> <!--PONER EL avatar--> </div>
                    <div>
                        <div class="sidebar__user-name"> <!--PONER EL NOMBRE DEL QUE ENTRO--> </div>
                        <div class="sidebar__user-role"> <!--PONER EL ROL DEL QUE ENTRO--> </div>
                    </div>
                </div>
            <a class="sidebar__logout" href='InicioSesion.html'><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Cerrar sesión </a>
            </div>
        </aside>

        <!-- BARRA SUPERIOR -->
        <main class="main">
            <header class="topbar">
                <div class="topbar__title">Notificaciones</div>
                <div class="topbar__right">
                    <div class="notif-bell"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/> <path d="M13.73 21a2 2 0 0 1-3.46 0"/> </svg> <span class="notif-badge" id="notifBadge"><!--PONER la cantidad de notificaciones realies que tengo--></span> </div>
                    <div class="avatar"> <!--PONER EL avatar--> </div>
                </div>
            </header>

            <!-- PANTALLA NOTIFICACIONES-->

            <!-- Encabezado de sección -->
            <div class="notif-header">
                <div>
                    <h2 class="welcome__title">Notificaciones</h2>
                    <p class="notif-header__count" id="notifCount"><!-- Cantidad de notificaciones por leer --> sin leer</p>
                </div>
                <button class="notif-btn-leer" id="btnLeerTodas"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"> <polyline points="20 6 9 17 4 12"/></svg> Marcar todas como leídas </button>
            </div>
            <div class="notif-filters" role="group" aria-label="Filtrar notificaciones">
                <button class="notif-filter is-active" type="button" data-filter="todas">Todas</button>
                <button class="notif-filter" type="button" data-filter="no-leidas">No leídas (activas)</button>
                <button class="notif-filter" type="button" data-filter="leidas">Leídas</button>
            </div>

            <!-- Lista de notificaciones -->
            <div class="notif-list" id="notifList">
                <!-- Notificaciones inyectadas por Admin-Notificaciones.js -->
            </div>
        </main>
    </div>
    <script src="session-ui.js"></script>
  <script src="Admin-Notificaciones.js"></script>
</body>
</html>
